name: Test Linux Runner

on:
  workflow_dispatch:
permissions:
  contents: read  

jobs:
  test:
    runs-on: ubuntu-latest
    name: CI Build
    steps:
    
    - name: Checkout
      uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      
    - name: Test Action
      uses: irongut/CodeCoverageSummary@f13848964841ca2f7a63343b287493e17dc645de # master
      with:
        filename: /src/coverage.*.xml
        badge: true
        fail_below_min: true
        format: markdown
        hide_branch_rate: false
        hide_complexity: true
        indicators: true
        output: both
        thresholds: '60 80'
