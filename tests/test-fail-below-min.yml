name: Test fail below minimum threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy low coverage fixture into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/coverage-low.xml" "$GITHUB_WORKSPACE/coverage-low.xml"
      - id: action
        uses: .
        continue-on-error: true
        with:
          filename: coverage-low.xml
          format: text
          output: console
          indicators: 'true'
          badge: 'false'
          fail_below_min: 'true'
          thresholds: '50 75'
      - name: Assert action failed due to low coverage
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed because coverage (30%) is below lower threshold (50%)"
          else
            echo "FAIL: expected action to fail due to low coverage but outcome was '$OUTCOME'"
            exit 1
          fi
