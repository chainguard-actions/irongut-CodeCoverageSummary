name: Test file output mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Code Coverage Summary (file output)
        id: action
        uses: .
        with:
          filename: tests/fixtures/coverage.xml
          format: text
          output: file
      - name: Assert output file was created
        run: |
          echo "Checking for output file..."
          # The action writes to code-coverage-results.txt in the workspace
          if ls code-coverage-results* 2>/dev/null | grep -q .; then
            echo "PASS: output file found"
            cat code-coverage-results* || true
          else
            echo "Listing workspace files for debugging:"
            ls -la
            echo "FAIL: no output file found"
            exit 1
          fi
