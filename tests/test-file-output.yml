name: Test file output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy coverage fixture into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/coverage-high.xml" "$GITHUB_WORKSPACE/coverage.xml"
      - id: action
        uses: .
        with:
          filename: coverage.xml
          format: markdown
          output: file
          indicators: 'true'
          badge: 'false'
          fail_below_min: 'false'
          thresholds: '50 75'
      - name: Assert output file was created
        run: |
          echo "Checking for output file..."
          # The action writes to code-coverage-results.md by default
          if [ -f "$GITHUB_WORKSPACE/code-coverage-results.md" ]; then
            echo "PASS: output file code-coverage-results.md was created"
            cat "$GITHUB_WORKSPACE/code-coverage-results.md"
          else
            echo "Listing workspace contents:"
            ls -la "$GITHUB_WORKSPACE/"
            echo "FAIL: expected output file code-coverage-results.md not found"
            exit 1
          fi
