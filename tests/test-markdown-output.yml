name: Test markdown format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Code Coverage Summary (markdown format with badge)
        id: action
        uses: .
        with:
          filename: '**/tests/fixtures/coverage.xml'
          format: markdown
          output: console
          badge: 'true'
          indicators: 'true'
          hide_branch_rate: 'false'
          hide_complexity: 'false'
          fail_below_min: 'false'
          thresholds: '50 75'
      - name: Assert action succeeded with markdown output
        run: |
          echo "Action completed successfully with markdown format output and badge"
          echo "PASS"
