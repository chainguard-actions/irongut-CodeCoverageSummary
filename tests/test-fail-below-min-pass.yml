name: Test fail below min - coverage above threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Code Coverage Summary (coverage above threshold, should pass)
        id: action
        uses: .
        with:
          filename: '**/tests/fixtures/coverage.xml'
          format: text
          output: console
          fail_below_min: 'true'
          thresholds: '50 75'
          indicators: 'true'
          badge: 'false'
          hide_branch_rate: 'false'
          hide_complexity: 'false'
      - name: Assert action passed (coverage 85% is above lower threshold 50%)
        run: |
          echo "Action completed successfully - coverage 85% is above lower threshold 50%"
          echo "PASS"
