name: Test markdown format output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Code Coverage Summary (markdown format)
        id: action
        uses: .
        with:
          filename: tests/fixtures/coverage.xml
          format: markdown
          output: console
          indicators: 'true'
      - name: Assert action completed successfully
        run: |
          echo "Action completed with markdown format"
          echo "PASS"
