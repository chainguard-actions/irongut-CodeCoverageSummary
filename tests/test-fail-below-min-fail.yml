name: Test fail below min - coverage below threshold
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Code Coverage Summary (coverage below threshold, should fail)
        id: action
        uses: .
        continue-on-error: true
        with:
          filename: '**/tests/fixtures/low-coverage.xml'
          format: text
          output: console
          fail_below_min: 'true'
          thresholds: '50 75'
          indicators: 'true'
          badge: 'false'
          hide_branch_rate: 'false'
          hide_complexity: 'false'
      - name: Assert action failed (coverage 30% is below lower threshold 50%)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "actual outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when coverage 30% is below threshold 50%, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when coverage was below threshold"
