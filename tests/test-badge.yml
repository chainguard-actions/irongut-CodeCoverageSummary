name: Test badge output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy coverage fixture into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/coverage-high.xml" "$GITHUB_WORKSPACE/coverage.xml"
      - id: action
        uses: .
        with:
          filename: coverage.xml
          format: markdown
          output: console
          indicators: 'true'
          badge: 'true'
          fail_below_min: 'false'
          thresholds: '50 75'
      - name: Assert action succeeded with badge
        run: |
          echo "Action completed successfully with badge enabled"
          echo "PASS"
