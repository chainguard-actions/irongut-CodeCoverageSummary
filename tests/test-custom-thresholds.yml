name: Test custom thresholds
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Code Coverage Summary with custom thresholds (coverage passes)
        id: action
        uses: .
        with:
          filename: tests/fixtures/coverage.xml
          format: text
          output: console
          fail_below_min: 'true'
          thresholds: '70 90'
          indicators: 'true'
      - name: Assert action completed successfully (85% coverage above 70% lower threshold)
        run: |
          echo "Action completed with custom thresholds (70 90)"
          echo "Coverage is 85% which is above the lower threshold of 70%"
          echo "PASS"
